; Xdebug is compiled in but does nothing until XDEBUG_MODE is set.
; Step debugging:  XDEBUG_MODE=debug docker compose up -d php
zend_extension = xdebug

xdebug.mode = off
xdebug.start_with_request = yes
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = PHPSTORM
xdebug.log_level = 0
