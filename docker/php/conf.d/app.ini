; --- dev-oriented PHP settings -------------------------------------------
memory_limit = 512M

; UserController accepts profile pictures up to 5M; PHP's 2M default would
; reject them before validation ever runs.
upload_max_filesize = 8M
post_max_size = 12M

max_execution_time = 120
date.timezone = UTC

display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Recompile on change so edits show up without a container restart.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000

realpath_cache_size = 4096K
realpath_cache_ttl = 600
