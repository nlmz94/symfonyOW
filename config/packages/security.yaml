security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider: { entity: { class: App\Entity\User, property: email } }
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|media|images)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

            # POST {"email": "...", "password": "...", "_remember_me": true}
            # Failures are answered by JsonLoginFailureHandler (401, or 429 once
            # throttled); on success the request falls through to
            # SecurityController::login.
            json_login:
                check_path: api_auth_login
                username_path: email
                password_path: password
                failure_handler: App\Security\JsonLoginFailureHandler

            logout:
                path: api_auth_logout

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 1209600     # 14 days
                path: /

    access_control:
        - { path: ^/api/auth, roles: PUBLIC_ACCESS }
        - { path: ^/api/me, roles: ROLE_USER }
