# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Session cookie carries the login for the Nuxt frontend. The session is
    # started ONLY if something reads or writes it (login, /api/me, ...).
    # SameSite=lax is enough while Nuxt and the API share a site (same
    # registrable domain, any port). If they ever live on different sites,
    # switch to cookie_samesite: none + cookie_secure: true.
    session:
        cookie_samesite: lax
        cookie_secure: auto
        cookie_httponly: true

    http_method_override: false
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port']
    trusted_proxies: '%env(TRUSTED_PROXIES)%'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
